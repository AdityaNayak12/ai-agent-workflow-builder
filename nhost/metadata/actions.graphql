type Mutation {
  triggerWorkflowRun(
    workflow_id: uuid!
  ): WorkflowRunResult
}

type Mutation {
  approveStep(
    step_run_id: uuid!
  ): ApproveStepResult
}

type Mutation {
  createWebhookTrigger(
    workflow_id: uuid!
  ): CreateWebhookTriggerResult
}

type WorkflowRunResult {
  run_id: uuid!
  status: String!
}

type ApproveStepResult {
  step_run_id: uuid!
  status: String!
  resumed: Boolean!
}

type CreateWebhookTriggerResult {
  trigger_id: uuid!
  webhook_url: String!
  secret: String!
}
