table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - finished_at
        - created_at
      filter:
        workflow_run:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
event_triggers:
  - name: notify_delivery_trigger
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      num_retries: 2
      interval_sec: 10
      timeout_sec: 10
    webhook: '{{NHOST_FUNCTIONS_URL}}/webhook/notify-delivery'
